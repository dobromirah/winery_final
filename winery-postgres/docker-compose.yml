services:
  postgres:
    image: postgres:18
    container_name: winery-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - winery-postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  winery-postgres:
    external: true
